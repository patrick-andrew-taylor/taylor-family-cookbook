# Tooling config for the cookbook. Run `mise install` after cloning.
#
# The Ruby version itself is NOT set here -- it lives in .ruby-version, which
# Netlify's build image reads natively, so local and CI share one source of
# truth. mise ignores idiomatic version files like .ruby-version unless it is
# explicitly told to read them; without the [settings] block below mise would
# silently fall back to your global default and quietly disagree with CI.
[settings]
idiomatic_version_file_enable_tools = ["ruby"]

[tasks.build]
description = "Build the site into _site/"
run = "bundle exec jekyll build --trace"

[tasks.serve]
description = "Serve the cookbook at http://localhost:4000"
run = "bundle exec jekyll serve --livereload"
