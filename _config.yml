remote_theme: "mmistakes/so-simple-theme@3.2.0"
locale: "en-us"
title: "The Jain-Taylor Family Cookbook"
description: "Generations of Recipes, From GG to You and Me"
url: "https://recipes.taylors.family"
logo: "/assets/img/cookbook.jpg"
date_format: "%B %-d, %Y"
round-avatar: true
# Build settings
permalink: /:categories/:title/
feed:
  path: atom.xml
# Pagination
paginate: 10
paginate_path: "/page:num/"
# Search
search_full_content: true
# Taxonomy
category_archive_path: "/categories/#"
tag_archive_path: "/tags/#"
plugins:
  - jekyll-paginate
  - jekyll-readme-index
  - jekyll-relative-links
  - jekyll-sitemap
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-remote-theme # required to load remote_theme on non-GitHub-Pages builds (Netlify previews)
# Collections
collections:
  recipes:
    output: true
    permalink: /:collection/:categories/:title/
# Front Matter Defaults
defaults:
  # Post defaults
  - scope:
      path: "_posts"
      type: posts
    values:
      layout: post
      comments: true
      share: true
  # Recipe defaults
  - scope:
      path: "_recipes"
      type: recipes
    values:
      layout: post
      comments: true
      share: true
relative_links:
  enabled: true
  collections: true
readme_index:
  enabled: true
  remove_originals: false
  with_frontmatter: true
include:
  - CHANGELOG.md
  - README.md
  - LICENSE.md
  - _pages
# Keep tooling config out of the published site. NOTE: setting `exclude` replaces
# Jekyll's built-in defaults rather than adding to them, so the vendor/ and
# Gemfile entries below must stay -- without them `bundle install --path
# vendor/bundle` would publish the entire gem bundle.
exclude:
  - .sass-cache/
  - .jekyll-cache/
  - gemfiles/
  - Gemfile
  - Gemfile.lock
  - node_modules/
  - vendor/
  - mise.toml
  - netlify.toml
  - commitlint.config.js
  - "ruleset - Protect main.json"
footer_links:
  - title: LinkedIn
    url: https://www.linkedin.com/in/patrickandrewtaylor/
    icon: fab fa-linkedin
  - title: GitHub
    url: https://github.com/patrick-andrew-taylor
    icon: fab fa-github-square
categories: [Appetizers, Breakfast, Desserts, Drinks, Entrees, Miscellaneous, Seasonings, Side Dishes, Soups]
tags: [Vegetarian, Vegan, Meat]
